<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        textarea {
            width: 100%;
            height: 150px;
        }
        #check {
            margin-top: 10px;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Grammar Checker</h1>
    <p>Enter text below and click "Check grammar" to find common mistakes.</p>
    <textarea id="text" placeholder="Type your text here..."></textarea><br>
    <button id="check">Check grammar</button>
    <div id="output"></div>
    <script src="script.js"></script>
</body>
</html>
